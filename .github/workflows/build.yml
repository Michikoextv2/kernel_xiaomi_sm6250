name: 🔨 Michiko Kernel Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Custom release tag (leave empty for auto)"
        required: false
        default: ""
      send_telegram:
        description: "Send to Telegram after build?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: write

    env:
      ARCH: arm64
      KBUILD_BUILD_HOST: github-ci
      KBUILD_BUILD_USER: michiko
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_DIR: ${{ github.workspace }}/foxe-clang/install
      GCC32_DIR: ${{ github.workspace }}/fox-gcc32
      AK3_DIR: ${{ github.workspace }}/AnyKernel3
      KERNEL_DIR: ${{ github.workspace }}
      KERNEL_NAME: Michiko-Kernel
      TARGET_DEVICE: Poco X3 NFC (surya/karna)
      DEFCONFIG: vendor/xiaomi/miatoll_defconfig

    steps:
      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------
      - name: 📥 Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: FoxMiko-Labs/kernel_xiaomi_sm6250
          ref: lineage-23.2
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 5

      # -------------------------------------------------------
      # 2. Dependencies
      # -------------------------------------------------------
      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git jq libelf-dev libssl-dev lld llvm make \
            python3 unzip xz-utils zstd ccache
          echo "✅ Dependencies installed"

      # -------------------------------------------------------
      # 3. Toolchain — FoxeClang
      # -------------------------------------------------------
      - name: 🔧 Restore FoxeClang cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: foxe-clang-v24.0-20260822

      - name: ⬇️ Download FoxeClang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          curl -Lo foxe-clang.tar.zst \
            "https://github.com/FoxMiko-Labs/FoxeClang/releases/download/v23.0-20260822/FoxeClang-23.0-20260822.tar.zst"
          tar --zstd -xf foxe-clang.tar.zst -C "$CLANG_DIR" --strip-components=1
          rm -f foxe-clang.tar.zst
          echo "✅ FoxeClang ready"

      # -------------------------------------------------------
      # 4. Toolchain — FoxGCC ARM32
      # -------------------------------------------------------
      - name: 🔧 Restore FoxGCC ARM32 cache
        id: cache-gcc32
        uses: actions/cache@v4
        with:
          path: ${{ env.GCC32_DIR }}
          key: fox-gcc32-v17.0-20260822

      - name: ⬇️ Download FoxGCC ARM32
        if: steps.cache-gcc32.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GCC32_DIR"
          curl -Lo fox-gcc32.tar.zst \
            "https://github.com/FoxMiko-Labs/Fox-GCC/releases/download/v17.0-20260822/FoxGCC-17-arm-20260822.tar.zst"
          tar -I zstd -xf fox-gcc32.tar.zst -C "$GCC32_DIR"
          rm -f fox-gcc32.tar.zst
          echo "✅ FoxGCC ARM32 ready"

      # -------------------------------------------------------
      # 5. Toolchain validation
      # -------------------------------------------------------
      - name: ✅ Validate toolchain
        run: |
          if [ ! -f "$CLANG_DIR/bin/clang" ]; then
            echo "❌ ERROR: clang not found"
            exit 1
          fi
          echo "✅ Clang : $("$CLANG_DIR/bin/clang" --version | head -n1)"
          GCC32_BIN=$(find "$GCC32_DIR" -name "arm-eabi-gcc" -type f | head -1)
          if [ -z "$GCC32_BIN" ]; then
            echo "⚠️  WARNING: arm-eabi-gcc not found"
          else
            echo "✅ GCC32 : $GCC32_BIN"
          fi

      # -------------------------------------------------------
      # 6. ccache
      # -------------------------------------------------------
      - name: 🗃️ Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-surya-${{ github.sha }}
          restore-keys: |
            ccache-surya-
            ccache-

      - name: ⚙️ Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "✅ ccache configured (max 5G)"

      # -------------------------------------------------------
      # 7. Build
      # -------------------------------------------------------
      - name: 🔨 Build kernel
        run: |
          echo "======================================================"
          echo " Device   : $TARGET_DEVICE"
          echo " Defconfig: $DEFCONFIG"
          echo " Cores    : $(nproc --all)"
          echo "======================================================"
          chmod +x buildci.sh
          bash buildci.sh
        env:
          CLANG_DIR: ${{ env.CLANG_DIR }}
          GCC32_DIR: ${{ env.GCC32_DIR }}

      # -------------------------------------------------------
      # 8. AnyKernel3
      # -------------------------------------------------------
      - name: 📦 Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/Michikoextv2/AnyKernel3-miatoll.git \
            -b miatoll "$AK3_DIR"

      - name: 🗜️ Package kernel zip
        run: |
          DATE_TAG=$(TZ=Asia/Jakarta date +%d%m%Y)
          ZIP_NAME="${KERNEL_NAME}-${DATE_TAG}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "DATE_TAG=${DATE_TAG}" >> "$GITHUB_ENV"

          for img in Image.gz dtb.img dtbo.img; do
            SRC="$KERNEL_DIR/out/arch/arm64/boot/$img"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$AK3_DIR/"
              echo "✅ Copied $img"
            else
              echo "⚠️  WARNING: $img not found"
            fi
          done

          cd "$AK3_DIR"
          zip -r9 "$KERNEL_DIR/${ZIP_NAME}" . \
            -x "*.git*" -x "README.md" -x "*.github*"

          ZIP_SIZE=$(du -sh "$KERNEL_DIR/${ZIP_NAME}" | cut -f1)
          echo "ZIP_SIZE=${ZIP_SIZE}" >> "$GITHUB_ENV"
          echo "✅ Packaged: ${ZIP_NAME} (${ZIP_SIZE})"

      # -------------------------------------------------------
      # 9. Release notes
      # -------------------------------------------------------
      - name: 📝 Generate release notes
        run: |
          COMMIT_LOG=$(git log -5 --pretty=format:"- \`%h\` %s — *%an*" --no-merges)
          cat > release_notes.md << NOTES
          ## 🔥 Michiko Kernel — Build ${DATE_TAG}

          ### 📱 Device
          - **Target:** ${TARGET_DEVICE}

          ### 📋 Last 5 Commits

          ${COMMIT_LOG}

          ### ⚙️ Build Info
          | Key | Value |
          |-----|-------|
          | Branch | \`lineage-23.2\` |
          | Runner | \`ubuntu-24.04\` |
          | Clang | FoxeClang v24.0-20260822 |
          | GCC ARM32 | FoxGCC v17.0-20260822 |
          | Defconfig | \`${DEFCONFIG}\` |
          | Size | ${ZIP_SIZE} |

          ---
          > Built with ❤️ by [Michikoextv2](https://github.com/Michikoextv2)
          NOTES
          cat release_notes.md

      # -------------------------------------------------------
      # 10. Upload artifact
      # -------------------------------------------------------
      - name: 📤 Upload kernel zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      # -------------------------------------------------------
      # 11. GitHub Release
      # -------------------------------------------------------
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('v{0}', env.DATE_TAG) }}
          name: "🔥 Michiko-Kernel ${{ env.DATE_TAG }}"
          body_path: release_notes.md
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 12. Telegram — kirim zip + caption simpel + link release
      # -------------------------------------------------------
      - name: 📨 Send to Telegram
        if: ${{ github.event.inputs.send_telegram != 'false' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
          ZIP_SIZE: ${{ env.ZIP_SIZE }}
          DATE_TAG: ${{ env.DATE_TAG }}
        run: |
          RELEASE_URL="https://github.com/Michikoextv2/kernel_xiaomi_sm6250/releases/tag/v${DATE_TAG}"

          CAPTION="🔥 *Michiko Kernel — Build ${DATE_TAG}*
          📱 *Device:* Poco X3 NFC \(surya/karna\)
          📦 *Size:* ${ZIP_SIZE}
          🔗 [Lihat Changelog & Commits](${RELEASE_URL})"

          curl -s -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="-1003988216382" \
            -F message_thread_id="3" \
            -F document=@"${ZIP_NAME}" \
            -F caption="${CAPTION}" \
            -F parse_mode="MarkdownV2" \
            | jq -e '.ok == true' && echo "✅ Sent to Telegram" || echo "⚠️ Telegram failed"

      # -------------------------------------------------------
      # 13. ccache stats
      # -------------------------------------------------------
      - name: 📊 Show ccache stats
        if: always()
        run: ccache --show-stats
